<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Pillar 2 — Suggest Refactor diff viewer with smell detection pills">
  <defs>
    <linearGradient id="p2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="p2shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .ui { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="url(#p2bg)"/>

  <!-- ========== Toolbar / header ========== -->
  <g filter="url(#p2shadow)">
    <rect x="40" y="40" width="1120" height="64" rx="12" fill="#121826" stroke="#1f2937"/>
    <!-- duck chip -->
    <circle cx="76" cy="72" r="16" fill="#fde68a"/>
    <circle cx="82" cy="68" r="3" fill="#0b0f17"/>
    <path d="M92 73 Q106 75 100 84 Q90 84 86 78 Z" fill="#f59e0b"/>
    <text x="102" y="78" class="ui" font-size="15" font-weight="700" fill="#e2e8f0">🦆 RubberDuck Live</text>
    <text x="262" y="78" class="ui" font-size="14" fill="#64748b">·  Refactor preview  ·  <tspan fill="#22d3ee">bad.py</tspan>  ·  <tspan fill="#cbd5e1">analyze()</tspan></text>

    <!-- buttons -->
    <rect x="970" y="54" width="80" height="36" rx="8" fill="#1f2937" stroke="#334155"/>
    <text x="1010" y="77" text-anchor="middle" class="ui" font-size="13" font-weight="600" fill="#cbd5e1">Cancel</text>
    <rect x="1060" y="54" width="90" height="36" rx="8" fill="#8b5cf6"/>
    <text x="1105" y="77" text-anchor="middle" class="ui" font-size="13" font-weight="700" fill="#0b0f17">Apply ▸</text>
  </g>

  <!-- ========== Smell pills row ========== -->
  <g class="ui" font-size="12" font-weight="600">
    <text x="40" y="135" fill="#64748b">Detected smells</text>
    <g transform="translate(170,118)">
      <rect x="0" y="0" width="120" height="24" rx="12" fill="#f59e0b" opacity="0.18" stroke="#f59e0b"/>
      <text x="60" y="16" text-anchor="middle" fill="#fbbf24">🌀 nested_loops</text>
    </g>
    <g transform="translate(300,118)">
      <rect x="0" y="0" width="130" height="24" rx="12" fill="#f59e0b" opacity="0.18" stroke="#f59e0b"/>
      <text x="65" y="16" text-anchor="middle" fill="#fbbf24">🔢 magic_number</text>
    </g>
    <g transform="translate(440,118)">
      <rect x="0" y="0" width="180" height="24" rx="12" fill="#f59e0b" opacity="0.18" stroke="#f59e0b"/>
      <text x="90" y="16" text-anchor="middle" fill="#fbbf24">🧬 duplicate_predicate</text>
    </g>
    <g transform="translate(1000,118)">
      <rect x="0" y="0" width="160" height="24" rx="12" fill="#22d3ee" opacity="0.18" stroke="#22d3ee"/>
      <text x="80" y="16" text-anchor="middle" fill="#22d3ee">−42% complexity</text>
    </g>
  </g>

  <!-- ========== Split diff ========== -->
  <!-- Left: Original -->
  <g filter="url(#p2shadow)">
    <rect x="40" y="160" width="555" height="530" rx="12" fill="#121826" stroke="#1f2937"/>
    <rect x="40" y="160" width="555" height="34" rx="12" fill="#0f172a"/>
    <rect x="40" y="182" width="555" height="12" fill="#0f172a"/>
    <circle cx="60" cy="177" r="5" fill="#ef4444"/>
    <text x="78" y="181" class="ui" font-size="12" fill="#fca5a5" font-weight="700">ORIGINAL</text>
    <text x="180" y="181" class="mono" font-size="12" fill="#64748b">bad.py · 14 lines</text>

    <!-- gutter -->
    <rect x="40" y="194" width="46" height="496" fill="#0d1320"/>
    <g class="mono" font-size="11" fill="#64748b" text-anchor="end">
      <text x="78" y="222">12</text><text x="78" y="242">13</text><text x="78" y="262">14</text>
      <text x="78" y="282">15</text><text x="78" y="302">16</text><text x="78" y="322">17</text>
      <text x="78" y="342">18</text><text x="78" y="362">19</text><text x="78" y="382">20</text>
      <text x="78" y="402">21</text><text x="78" y="422">22</text><text x="78" y="442">23</text>
      <text x="78" y="462">24</text><text x="78" y="482">25</text>
    </g>

    <!-- red highlights on nested loop block -->
    <rect x="86" y="290" width="509" height="116" fill="#ef4444" opacity="0.10"/>
    <rect x="86" y="290" width="4"   height="116" fill="#ef4444"/>

    <g class="mono" font-size="12">
      <text x="100" y="222"><tspan fill="#c084fc">def</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#22d3ee">analyze</tspan><tspan fill="#e2e8f0">(users, orders):</tspan></text>
      <text x="120" y="242"><tspan fill="#94a3b8"># find users who ordered more than 100 items</tspan></text>
      <text x="120" y="262"><tspan fill="#e2e8f0">matches = []</tspan></text>
      <text x="120" y="282"><tspan fill="#c084fc">for</tspan><tspan fill="#e2e8f0"> u </tspan><tspan fill="#c084fc">in</tspan><tspan fill="#e2e8f0"> users:</tspan></text>
      <text x="140" y="302"><tspan fill="#c084fc">for</tspan><tspan fill="#e2e8f0"> o </tspan><tspan fill="#c084fc">in</tspan><tspan fill="#e2e8f0"> orders:</tspan></text>
      <text x="160" y="322"><tspan fill="#c084fc">for</tspan><tspan fill="#e2e8f0"> item </tspan><tspan fill="#c084fc">in</tspan><tspan fill="#e2e8f0"> o.items:</tspan></text>
      <text x="180" y="342"><tspan fill="#c084fc">if</tspan><tspan fill="#e2e8f0"> o.user_id == u.id:</tspan></text>
      <text x="200" y="362"><tspan fill="#c084fc">if</tspan><tspan fill="#e2e8f0"> item.qty &gt; </tspan><tspan fill="#fbbf24">100</tspan><tspan fill="#e2e8f0">:</tspan></text>
      <text x="220" y="382"><tspan fill="#c084fc">if</tspan><tspan fill="#e2e8f0"> u </tspan><tspan fill="#c084fc">not in</tspan><tspan fill="#e2e8f0"> matches:</tspan></text>
      <text x="240" y="402"><tspan fill="#e2e8f0">matches.append(u)</tspan></text>
      <text x="120" y="442"><tspan fill="#c084fc">return</tspan><tspan fill="#e2e8f0"> matches</tspan></text>
    </g>

    <!-- gutter tooltip -->
    <g transform="translate(86,470)">
      <rect x="0" y="0" width="320" height="46" rx="8" fill="#1a2233" stroke="#ef4444"/>
      <text x="14" y="20" class="ui" font-size="12" font-weight="700" fill="#fca5a5">⚠ nested_loops · O(n³)</text>
      <text x="14" y="36" class="ui" font-size="11" fill="#cbd5e1">Three nested iterations — collapse via set intersect</text>
    </g>
  </g>

  <!-- Right: Refactored -->
  <g filter="url(#p2shadow)">
    <rect x="605" y="160" width="555" height="530" rx="12" fill="#121826" stroke="#1f2937"/>
    <rect x="605" y="160" width="555" height="34" rx="12" fill="#0f172a"/>
    <rect x="605" y="182" width="555" height="12" fill="#0f172a"/>
    <circle cx="625" cy="177" r="5" fill="#22c55e"/>
    <text x="643" y="181" class="ui" font-size="12" fill="#86efac" font-weight="700">REFACTORED</text>
    <text x="760" y="181" class="mono" font-size="12" fill="#64748b">bad.py · 8 lines  ·  ✓ reviewer passed</text>

    <rect x="605" y="194" width="46" height="496" fill="#0d1320"/>
    <g class="mono" font-size="11" fill="#64748b" text-anchor="end">
      <text x="643" y="222">12</text><text x="643" y="242">13</text><text x="643" y="262">14</text>
      <text x="643" y="282">15</text><text x="643" y="302">16</text><text x="643" y="322">17</text>
      <text x="643" y="342">18</text><text x="643" y="362">19</text><text x="643" y="382">20</text>
    </g>

    <!-- green add-line highlight -->
    <rect x="651" y="248" width="509" height="136" fill="#22c55e" opacity="0.10"/>
    <rect x="651" y="248" width="4"   height="136" fill="#22d3ee"/>

    <g class="mono" font-size="12">
      <text x="665" y="222"><tspan fill="#c084fc">THRESHOLD</tspan><tspan fill="#e2e8f0"> = </tspan><tspan fill="#fbbf24">100</tspan></text>
      <text x="665" y="262"><tspan fill="#c084fc">def</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#22d3ee">analyze</tspan><tspan fill="#e2e8f0">(users, orders):</tspan></text>
      <text x="685" y="282"><tspan fill="#e2e8f0">big_orders = {</tspan></text>
      <text x="705" y="302"><tspan fill="#e2e8f0">o.user_id </tspan><tspan fill="#c084fc">for</tspan><tspan fill="#e2e8f0"> o </tspan><tspan fill="#c084fc">in</tspan><tspan fill="#e2e8f0"> orders</tspan></text>
      <text x="705" y="322"><tspan fill="#c084fc">if</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#c084fc">any</tspan><tspan fill="#e2e8f0">(i.qty &gt; THRESHOLD </tspan></text>
      <text x="725" y="342"><tspan fill="#c084fc">for</tspan><tspan fill="#e2e8f0"> i </tspan><tspan fill="#c084fc">in</tspan><tspan fill="#e2e8f0"> o.items)</tspan></text>
      <text x="685" y="362"><tspan fill="#e2e8f0">}</tspan></text>
      <text x="685" y="382"><tspan fill="#c084fc">return</tspan><tspan fill="#e2e8f0"> [u </tspan><tspan fill="#c084fc">for</tspan><tspan fill="#e2e8f0"> u </tspan><tspan fill="#c084fc">in</tspan><tspan fill="#e2e8f0"> users </tspan><tspan fill="#c084fc">if</tspan><tspan fill="#e2e8f0"> u.id </tspan><tspan fill="#c084fc">in</tspan><tspan fill="#e2e8f0"> big_orders]</tspan></text>
    </g>

    <!-- reviewer checklist -->
    <g transform="translate(651,430)" class="ui" font-size="12">
      <rect x="0" y="0" width="494" height="230" rx="10" fill="#0d1320" stroke="#1f2937"/>
      <text x="16" y="24" font-weight="700" fill="#cbd5e1">Reviewer pass ✓</text>
      <g fill="#94a3b8">
        <text x="16" y="52"><tspan fill="#22c55e">✓</tspan>  Behaviour preserved (set-intersection equivalence)</text>
        <text x="16" y="74"><tspan fill="#22c55e">✓</tspan>  Complexity reduced O(n³) → O(n+m)</text>
        <text x="16" y="96"><tspan fill="#22c55e">✓</tspan>  Magic number `100` extracted to `THRESHOLD`</text>
        <text x="16" y="118"><tspan fill="#22c55e">✓</tspan>  Duplicate predicate removed</text>
        <text x="16" y="140"><tspan fill="#22c55e">✓</tspan>  No new imports introduced</text>
      </g>
      <line x1="16" y1="160" x2="478" y2="160" stroke="#1f2937"/>
      <text x="16" y="184" fill="#64748b">Model: <tspan fill="#22d3ee">gpt-4o-mini</tspan>  ·  latency 1.8 s  ·  tokens 412 in / 198 out</text>
      <text x="16" y="206" fill="#64748b">Apply inserts 8 lines, removes 12 — native IntelliJ diff writer</text>
    </g>
  </g>

  <!-- ========== Footer label ========== -->
  <g class="ui">
    <text x="40" y="730" font-size="13" fill="#64748b" font-weight="600">
      <tspan fill="#8b5cf6">Pillar 2</tspan>  ·  Smell detection + native IntelliJ diff viewer  ·  one-click Apply
    </text>
    <text x="1160" y="730" text-anchor="end" font-size="10" fill="#64748b" opacity="0.3">Mockup</text>
  </g>
</svg>
