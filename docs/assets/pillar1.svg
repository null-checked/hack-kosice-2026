<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Pillar 1 — Right-click Generate Tests action in IntelliJ with generated pytest file">
  <defs>
    <linearGradient id="p1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="p1accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="p1shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="4" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .ui { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="url(#p1bg)"/>

  <!-- ========== Editor panel: fizz.py ========== -->
  <g filter="url(#p1shadow)">
    <rect x="40" y="40" width="700" height="330" rx="12" fill="#121826" stroke="#1f2937"/>
    <!-- title bar -->
    <rect x="40" y="40" width="700" height="34" rx="12" fill="#0f172a"/>
    <rect x="40" y="62" width="700" height="12" fill="#0f172a"/>
    <circle cx="60"  cy="57" r="6" fill="#ef4444"/>
    <circle cx="80"  cy="57" r="6" fill="#f59e0b"/>
    <circle cx="100" cy="57" r="6" fill="#22c55e"/>
    <rect x="130" y="46" width="90" height="22" rx="6" fill="#1f2937"/>
    <text x="175" y="61" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">fizz.py</text>
    <rect x="230" y="46" width="110" height="22" rx="6" fill="#0b0f17"/>
    <text x="285" y="61" text-anchor="middle" class="mono" font-size="12" fill="#64748b">test_fizz.py</text>

    <!-- gutter -->
    <rect x="40" y="74" width="46" height="296" fill="#0d1320"/>
    <g class="mono" font-size="12" fill="#64748b" text-anchor="end">
      <text x="78" y="105">1</text>
      <text x="78" y="125">2</text>
      <text x="78" y="145">3</text>
      <text x="78" y="165">4</text>
      <text x="78" y="185">5</text>
      <text x="78" y="205">6</text>
      <text x="78" y="225">7</text>
      <text x="78" y="245">8</text>
      <text x="78" y="265">9</text>
      <text x="78" y="285">10</text>
    </g>

    <!-- code -->
    <g class="mono" font-size="13">
      <text x="100" y="105" fill="#64748b"># fizz.py — classic fizzbuzz stub</text>
      <text x="100" y="145"><tspan fill="#c084fc">def</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#22d3ee">fizzbuzz</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#f59e0b">n</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#22d3ee">int</tspan><tspan fill="#e2e8f0">) -&gt; </tspan><tspan fill="#22d3ee">str</tspan><tspan fill="#e2e8f0">:</tspan></text>
      <text x="120" y="165" fill="#94a3b8">"""Return 'Fizz', 'Buzz', 'FizzBuzz' or the number."""</text>
      <text x="120" y="205"><tspan fill="#c084fc">if</tspan><tspan fill="#e2e8f0"> n % </tspan><tspan fill="#fbbf24">15</tspan><tspan fill="#e2e8f0"> == </tspan><tspan fill="#fbbf24">0</tspan><tspan fill="#e2e8f0">:</tspan></text>
      <text x="140" y="225"><tspan fill="#c084fc">return</tspan><tspan fill="#86efac"> "FizzBuzz"</tspan></text>
      <text x="120" y="245"><tspan fill="#c084fc">if</tspan><tspan fill="#e2e8f0"> n % </tspan><tspan fill="#fbbf24">3</tspan><tspan fill="#e2e8f0"> == </tspan><tspan fill="#fbbf24">0</tspan><tspan fill="#e2e8f0">:</tspan></text>
      <text x="140" y="265"><tspan fill="#c084fc">return</tspan><tspan fill="#86efac"> "Fizz"</tspan></text>
      <text x="120" y="285"><tspan fill="#c084fc">if</tspan><tspan fill="#e2e8f0"> n % </tspan><tspan fill="#fbbf24">5</tspan><tspan fill="#e2e8f0"> == </tspan><tspan fill="#fbbf24">0</tspan><tspan fill="#e2e8f0">:</tspan></text>
      <text x="140" y="305"><tspan fill="#c084fc">return</tspan><tspan fill="#86efac"> "Buzz"</tspan></text>
      <text x="120" y="325"><tspan fill="#c084fc">return</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#22d3ee">str</tspan><tspan fill="#e2e8f0">(n)</tspan></text>
    </g>

    <!-- caret / selection highlight on fizzbuzz -->
    <rect x="152" y="133" width="86" height="18" rx="3" fill="#8b5cf6" opacity="0.18"/>
  </g>

  <!-- ========== Context menu ========== -->
  <g filter="url(#p1shadow)" transform="translate(240,180)">
    <rect x="0" y="0" width="260" height="210" rx="10" fill="#1a2233" stroke="#334155"/>
    <g class="ui" font-size="13" fill="#e2e8f0">
      <text x="18" y="28">Cut</text>
      <text x="18" y="52">Copy</text>
      <text x="18" y="76">Paste</text>
      <line x1="12" y1="92" x2="248" y2="92" stroke="#334155"/>
      <text x="18" y="114">Refactor</text>
      <text x="18" y="138">Find Usages</text>
      <line x1="12" y1="154" x2="248" y2="154" stroke="#334155"/>
      <!-- RubberDuck highlighted -->
      <rect x="6" y="162" width="248" height="30" rx="6" fill="#8b5cf6" opacity="0.22"/>
      <text x="18" y="182" fill="#c4b5fd">🦆  RubberDuck Live</text>
      <text x="238" y="182" text-anchor="end" fill="#c4b5fd">▶</text>
    </g>
  </g>

  <!-- ========== Submenu ========== -->
  <g filter="url(#p1shadow)" transform="translate(510,332)">
    <rect x="0" y="0" width="230" height="120" rx="10" fill="#1a2233" stroke="#8b5cf6"/>
    <!-- highlighted item -->
    <rect x="6" y="8" width="218" height="30" rx="6" fill="url(#p1accent)" opacity="0.85"/>
    <g class="ui" font-size="13">
      <text x="18" y="28" fill="#0b0f17" font-weight="700">🧪  Generate Tests</text>
      <text x="18" y="62" fill="#e2e8f0">♻️  Suggest Refactor</text>
      <text x="18" y="90" fill="#e2e8f0">🦆  Ask Rubber Duck…</text>
      <text x="18" y="110" fill="#64748b" font-size="11">Open Wellness Dashboard</text>
    </g>
  </g>

  <!-- ========== Generated test_fizz.py panel ========== -->
  <g filter="url(#p1shadow)">
    <rect x="40" y="410" width="1120" height="300" rx="12" fill="#121826" stroke="#1f2937"/>
    <!-- tab bar -->
    <rect x="40" y="410" width="1120" height="34" rx="12" fill="#0f172a"/>
    <rect x="40" y="432" width="1120" height="12" fill="#0f172a"/>
    <rect x="60" y="416" width="110" height="22" rx="6" fill="#0b0f17"/>
    <text x="115" y="431" text-anchor="middle" class="mono" font-size="12" fill="#64748b">fizz.py</text>
    <rect x="180" y="416" width="150" height="22" rx="6" fill="#1f2937"/>
    <text x="255" y="431" text-anchor="middle" class="mono" font-size="12" fill="#cbd5e1">test_fizz.py  •</text>

    <!-- "new" pill -->
    <rect x="1030" y="416" width="110" height="22" rx="11" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6"/>
    <text x="1085" y="431" text-anchor="middle" class="ui" font-size="11" font-weight="700" fill="#c4b5fd">✨ JUST GENERATED</text>

    <!-- gutter -->
    <rect x="40" y="444" width="46" height="266" fill="#0d1320"/>
    <g class="mono" font-size="12" fill="#64748b" text-anchor="end">
      <text x="78" y="475">1</text><text x="78" y="495">2</text><text x="78" y="515">3</text>
      <text x="78" y="535">4</text><text x="78" y="555">5</text><text x="78" y="575">6</text>
      <text x="78" y="595">7</text><text x="78" y="615">8</text><text x="78" y="635">9</text>
      <text x="78" y="655">10</text><text x="78" y="675">11</text><text x="78" y="695">12</text>
    </g>

    <g class="mono" font-size="13">
      <text x="100" y="475"><tspan fill="#c084fc">import</tspan><tspan fill="#e2e8f0"> pytest</tspan></text>
      <text x="100" y="495"><tspan fill="#c084fc">from</tspan><tspan fill="#e2e8f0"> fizz </tspan><tspan fill="#c084fc">import</tspan><tspan fill="#e2e8f0"> fizzbuzz</tspan></text>
      <text x="100" y="535"><tspan fill="#64748b">@</tspan><tspan fill="#22d3ee">pytest.mark.parametrize</tspan><tspan fill="#e2e8f0">(</tspan></text>
      <text x="120" y="555"><tspan fill="#86efac">"n, expected"</tspan><tspan fill="#e2e8f0">,</tspan></text>
      <text x="120" y="575"><tspan fill="#e2e8f0">[</tspan></text>
      <text x="140" y="595"><tspan fill="#e2e8f0">(</tspan><tspan fill="#fbbf24">1</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"1"</tspan><tspan fill="#e2e8f0">), (</tspan><tspan fill="#fbbf24">3</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"Fizz"</tspan><tspan fill="#e2e8f0">), (</tspan><tspan fill="#fbbf24">5</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"Buzz"</tspan><tspan fill="#e2e8f0">),</tspan></text>
      <text x="140" y="615"><tspan fill="#e2e8f0">(</tspan><tspan fill="#fbbf24">15</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"FizzBuzz"</tspan><tspan fill="#e2e8f0">), (</tspan><tspan fill="#fbbf24">30</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"FizzBuzz"</tspan><tspan fill="#e2e8f0">), (</tspan><tspan fill="#fbbf24">2</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">"2"</tspan><tspan fill="#e2e8f0">),</tspan></text>
      <text x="120" y="635"><tspan fill="#e2e8f0">],</tspan></text>
      <text x="100" y="655"><tspan fill="#e2e8f0">)</tspan></text>
      <text x="100" y="675"><tspan fill="#c084fc">def</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#22d3ee">test_fizzbuzz</tspan><tspan fill="#e2e8f0">(n, expected):</tspan></text>
      <text x="120" y="695"><tspan fill="#c084fc">assert</tspan><tspan fill="#e2e8f0"> fizzbuzz(n) == expected</tspan></text>
    </g>
  </g>

  <!-- ========== Footer label ========== -->
  <g class="ui">
    <text x="40" y="738" font-size="13" fill="#64748b" font-weight="600">
      <tspan fill="#8b5cf6">Pillar 1</tspan>  ·  Right-click → Generate Tests  ·  planner → worker → reviewer pipeline
    </text>
    <text x="1160" y="738" text-anchor="end" font-size="10" fill="#64748b" opacity="0.3">Mockup</text>
  </g>
</svg>
