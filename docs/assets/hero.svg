<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="RubberDuck Live — your IDE's pair programmer that watches you think">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#1b1740"/>
      <stop offset="1"   stop-color="#2a1056"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <!-- Duck mark -->
  <g transform="translate(90,90)">
    <circle cx="90" cy="90" r="88" fill="#fde68a" stroke="url(#accent)" stroke-width="4"/>
    <!-- Eye -->
    <circle cx="118" cy="72" r="10" fill="#0b1020"/>
    <circle cx="121" cy="69" r="3"  fill="#ffffff"/>
    <!-- Beak -->
    <path d="M150 95 Q188 102 176 126 Q150 128 138 108 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <!-- Wing hint -->
    <path d="M56 110 Q86 140 116 118 Q98 92 56 110 Z" fill="#fbbf24" opacity="0.8"/>
    <!-- "Live" dot -->
    <circle cx="160" cy="44" r="9" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wordmark -->
  <g transform="translate(310,120)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#f8fafc">
    <text x="0" y="0" font-size="72" font-weight="800" letter-spacing="-1.5">RubberDuck</text>
    <text x="0" y="70" font-size="72" font-weight="300" fill="url(#accent)" letter-spacing="-1.5">Live</text>
    <text x="0" y="120" font-size="22" font-weight="500" opacity="0.85">
      Your IDE's pair programmer that watches you think.
    </text>
    <g transform="translate(0,150)" font-size="14" font-weight="500" opacity="0.7">
      <text x="0"   y="14">🧪 Tests</text>
      <text x="90"  y="14">· ♻️ Refactor</text>
      <text x="220" y="14">· 🦆 Socratic nudges</text>
      <text x="400" y="14">· 100% local · Ollama by default</text>
    </g>
  </g>

  <!-- Corner badge -->
  <g transform="translate(1020,40)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="0" y="0" rx="14" ry="14" width="150" height="32" fill="url(#accent)"/>
    <text x="75" y="21" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1020">
      Hack Košice 2026
    </text>
  </g>
</svg>
