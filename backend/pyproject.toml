[project]
name = "rubberduck-live-backend"
version = "0.2.0"
description = "RubberDuck Live — local FastAPI backend for the IntelliJ plugin + dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "websockets>=13",
    "python-dotenv>=1.0",
    # ---- Multi-agent orchestrator (used only by /chat with mode="agent") ----
    # deepagents provides the hierarchical agent graph scaffolding; langchain-
    # openai is the ChatOpenAI client the orchestrator + sub-agents share;
    # langchain-community + ddgs supply the DuckDuckGo internet_search tool
    # (stripped when ORCHESTRATOR_WEB_SEARCH_ENABLED=false).
    "deepagents~=0.5.3",
    "langchain-openai~=0.3",
    "langchain-community~=0.3",
    "ddgs>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
